<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatório - Painel de Dados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        header {
            background-color: #1a252f;
            color: #ffffff;
            padding: 1rem 2rem;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        .iframe-container {
            flex: 1;
            width: 100%;
            min-height: 80vh;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            background-color: #e9ecef;
            text-align: center;
            padding: 1rem;
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Observatório</h1>
        <p>Painel de Visualização e Monitoramento de Dados</p>
    </header>

    <main>
        <div class="iframe-container">
            <!-- Substitua a URL abaixo pela URL do seu Posit Connect Cloud -->
            <iframe 
                src="https://connect.posit.cloud/seu-usuario/app/seu-app" 
                title="Painel Interativo do Observatório"
                loading="lazy"
                allow="fullscreen">
            </iframe>
        </div>
    </main>

    <footer>
        <p>© Observatório — Dados atualizados periodicamente.</p>
    </footer>

</body>
</html>
